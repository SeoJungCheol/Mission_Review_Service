services:
  - type: web
    name: filmlog-api
    runtime: docker
    rootDir: "미션 18/backend"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: filmlog-db
          property: connectionString
      - key: HF_HOME
        value: /tmp/huggingface

databases:
  - name: filmlog-db
    databaseName: filmlog
    user: filmlog
